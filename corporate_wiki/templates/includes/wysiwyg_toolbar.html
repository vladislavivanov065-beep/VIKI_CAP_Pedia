<div class="wysiwyg-toolbar" role="toolbar" aria-label="Форматирование текста">
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="bold" aria-label="Жирный"><strong>Ж</strong></button>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="italic" aria-label="Курсив"><em>К</em></button>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="strike" aria-label="Зачёркнутый"><s>З</s></button>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="code" aria-label="Код"><code>код</code></button>
    <span class="wysiwyg-toolbar__sep" aria-hidden="true"></span>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="h2" aria-label="Заголовок 2 уровня">H2</button>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="h3" aria-label="Заголовок 3 уровня">H3</button>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="paragraph" aria-label="Обычный текст">¶</button>
    <span class="wysiwyg-toolbar__sep" aria-hidden="true"></span>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="ul" aria-label="Маркированный список">• Список</button>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="ol" aria-label="Нумерованный список">1. Список</button>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="blockquote" aria-label="Цитата">❝</button>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="hr" aria-label="Горизонтальная линия">—</button>
    <span class="wysiwyg-toolbar__sep" aria-hidden="true"></span>
    <button type="button" class="wysiwyg-toolbar__btn" data-table-insert aria-label="Добавить таблицу">Таблица</button>
    <button type="button" class="wysiwyg-toolbar__btn" data-color-open="color" aria-label="Цвет текста" title="Цвет текста">
        <span class="wysiwyg-toolbar__color-swatch" style="background:#c0392b"></span>
    </button>
    <button type="button" class="wysiwyg-toolbar__btn" data-color-open="background-color" aria-label="Цвет фона текста" title="Цвет фона текста">
        <span class="wysiwyg-toolbar__color-swatch" style="background:#fff59d"></span>
    </button>
    <span class="wysiwyg-toolbar__sep" aria-hidden="true"></span>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="link" aria-label="Ссылка">Ссылка</button>
    <button type="button" class="wysiwyg-toolbar__btn" data-cmd="wikilink" aria-label="Ссылка на статью">[[Статья]]</button>
    <button type="button" class="wysiwyg-toolbar__btn" data-image-upload aria-label="Добавить изображение">Изображение</button>
    <button type="button" class="wysiwyg-toolbar__btn" data-attachment-upload aria-label="Прикрепить файл">Прикрепить файл</button>
    <input
        type="file"
        data-attachment-input
        accept=".txt,.docx,.pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf"
        class="hidden-file-input"
        aria-hidden="true"
        tabindex="-1"
    >
</div>
