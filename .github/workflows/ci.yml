name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: corporate_wiki

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: corporate_wiki/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The CUDA build of torch is several GB of GPU runtime libraries
          # this project never uses (apps.assistant's local AI is CPU-only
          # by design) -- installing the CPU wheel first keeps CI fast and
          # avoids fetching the CUDA one instead.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest -q
